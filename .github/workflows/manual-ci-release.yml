name: Manual CI Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true
        type: string
      release_name:
        description: Release name (optional)
        required: false
        type: string
      draft:
        description: Create as draft release
        required: false
        default: false
        type: boolean
      prerelease:
        description: Mark as pre-release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ./NtfsSnapshotMgr.slnx

      - name: Build
        run: dotnet build ./NtfsSnapshotMgr.slnx --configuration Release --no-restore

      - name: Detect test projects
        id: detect_tests
        shell: pwsh
        run: |
          $testProjects = Get-ChildItem -Path . -Recurse -Filter *.csproj | Where-Object {
            $content = Get-Content $_.FullName -Raw
            $content -match '<IsTestProject>\s*true\s*</IsTestProject>' -or $_.Name -match 'test'
          } | Select-Object -ExpandProperty FullName

          if ($testProjects.Count -gt 0) {
            $json = $testProjects | ConvertTo-Json -Compress
            "has_tests=true" >> $env:GITHUB_OUTPUT
            "projects=$json" >> $env:GITHUB_OUTPUT
          } else {
            "has_tests=false" >> $env:GITHUB_OUTPUT
          }

      - name: Run tests
        if: steps.detect_tests.outputs.has_tests == 'true'
        shell: pwsh
        run: |
          $projects = '${{ steps.detect_tests.outputs.projects }}' | ConvertFrom-Json
          if ($projects -isnot [array]) {
            $projects = @($projects)
          }

          foreach ($project in $projects) {
            dotnet test $project --configuration Release --no-build --verbosity normal
          }

      - name: No tests found
        if: steps.detect_tests.outputs.has_tests != 'true'
        run: echo "No test projects found. Skipping test execution."

      - name: Publish
        run: dotnet publish ./NtfsSnapshotMgr/NtfsSnapshotMgr.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true --output publish/win-x64

      - name: Package release artifact
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath publish/NtfsSnapshotMgr-win-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.tag }}
          files: publish/NtfsSnapshotMgr-win-x64.zip
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
